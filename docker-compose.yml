services:
  ductbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ductbot-system:latest
    container_name: ductbot_app
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - KIVY_WINDOW=sdl2
      - KIVY_GL_BACKEND=gl
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # X11 GUI Forwarding
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:ro
      # Hardware & Serial Device Access
      - /dev:/dev
      # USB Flash Drive Mounts for Export
      - /media:/media:rshared
      - /run/media:/run/media:rshared
      # Persistent App Data (Videos & SQLite Database survive rebuilds)
      - ./DuctbotsUI/Basic-Ductbots-main/videos:/app/ductbot-system/DuctbotsUI/Basic-Ductbots-main/videos
      - ./DuctbotsUI/Basic-Ductbots-main/database:/app/ductbot-system/DuctbotsUI/Basic-Ductbots-main/database
    devices:
      - /dev/snd:/dev/snd
    command: ["/app/ductbot-system/run_system.sh"]
